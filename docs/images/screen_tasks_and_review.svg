    <!-- Candidate 1 -->
    <g transform="translate(28, 210)">
      <rect x="0" y="0" width="304" height="68" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="1.2"/>
      <rect x="14" y="22" width="22" height="22" rx="6" fill="#14B8A6"/>
      <text x="25" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#042F2E">✓</text>
      <text x="48" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Buy organic milk</text>
      <rect x="48" y="38" width="102" height="20" rx="6" fill="#0F172A"/>
      <text x="99" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">+ Add Due Date</text>
    </g>

    <!-- Candidate 2 -->
    <g transform="translate(28, 288)">
      <rect x="0" y="0" width="304" height="68" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="1.2"/>
      <rect x="14" y="22" width="22" height="22" rx="6" fill="#14B8A6"/>
      <text x="25" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#042F2E">✓</text>
      <text x="48" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Pay electricity bill</text>
      <rect x="48" y="38" width="136" height="20" rx="6" fill="#134E4A"/>
      <text x="116" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#5EEAD4">📅 Due: 15th • 09:00</text>
    </g>

    <!-- Candidate 3 -->
    <g transform="translate(28, 366)">
      <rect x="0" y="0" width="304" height="68" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="1.2"/>
      <rect x="14" y="22" width="22" height="22" rx="6" fill="#14B8A6"/>
      <text x="25" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#042F2E">✓</text>
      <text x="48" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Book dentist appointment</text>
      <rect x="48" y="38" width="102" height="20" rx="6" fill="#0F172A"/>
      <text x="99" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">+ Add Due Date</text>
    </g>

    <!-- Bottom Action Buttons -->
    <g transform="translate(28, 452)">
      <rect x="0" y="0" width="110" height="44" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="55" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Ignore</text>

      <rect x="122" y="0" width="182" height="44" rx="12" fill="#14B8A6"/>
      <text x="213" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#042F2E">✓ Save 3 Tasks</text>
    </g>
  </g>
</svg>
