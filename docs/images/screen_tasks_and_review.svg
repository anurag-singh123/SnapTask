      <text x="44" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Send Q4 financial report</text>
      <text x="44" y="46" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">✉️ finance@acme.org • Extracted via ML Kit</text>
      <rect x="44" y="54" width="106" height="20" rx="6" fill="#1E3A8A"/>
      <text x="97" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#93C5FD">📅 Friday, 17:00</text>
    </g>

    <!-- Task Card 3 -->
    <g transform="translate(28, 346)">
      <rect x="0" y="0" width="304" height="74" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="28" r="10" fill="none" stroke="#94A3B8" stroke-width="2"/>
      <text x="44" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Pay electricity bill</text>
      <text x="44" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">🔗 portal.utility.example.com</text>
      <rect x="44" y="50" width="96" height="18" rx="6" fill="#78350F"/>
      <text x="92" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FCD34D">📅 Nov 15, 09:00</text>
    </g>

    <!-- FAB -->
    <rect x="276" y="394" width="52" height="52" rx="16" fill="#14B8A6"/>
    <text x="302" y="428" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#042F2E">+</text>

    <!-- Bottom Navigation Bar -->
