      <rect x="0" y="0" width="304" height="112" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <rect x="12" y="12" width="92" height="88" rx="8" fill="#0F172A" stroke="#14B8A6" stroke-width="1"/>
      <text x="58" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5EEAD4">Screenshot</text>
      <text x="58" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">1080 × 2400</text>
      <text x="58" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#38BDF8">🔍 Pinch Zoom</text>

      <text x="116" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">EXTRACTED OCR TEXT (EDITABLE)</text>
      <rect x="116" y="36" width="176" height="64" rx="8" fill="#0F172A"/>
      <text x="124" y="52" font-family="monospace" font-size="10" fill="#E2E8F0">- buy organic milk</text>
      <text x="124" y="68" font-family="monospace" font-size="10" fill="#E2E8F0">- pay electricity bill by 15th</text>
      <text x="124" y="84" font-family="monospace" font-size="10" fill="#E2E8F0">- book dentist appointment</text>
