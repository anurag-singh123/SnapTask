<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="620">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="620" rx="24" fill="url(#canvasBg)"/>

  <!-- Section Header -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#94A3B8" letter-spacing="1.5">
    CORE WORKFLOW — TASKS DASHBOARD &amp; SCREENSHOT OCR REVIEW
  </text>

  <!-- ==================== LEFT PHONE: TASKS SCREEN ==================== -->
  <g transform="translate(80, 62)" filter="url(#phoneShadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="360" height="528" rx="32" fill="#0B1120" stroke="#334155" stroke-width="3"/>
    <!-- Screen Content -->
    <rect x="12" y="12" width="336" height="504" rx="24" fill="#0F172A"/>

    <!-- Top App Bar -->
    <text x="32" y="48" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">SnapTask</text>
    <rect x="242" y="28" width="90" height="26" rx="13" fill="#134E4A"/>
    <text x="287" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#5EEAD4">4 Active</text>

    <!-- Search Bar -->
    <rect x="28" y="64" width="304" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="48" y="88" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">🔍  Search tasks or OCR notes...</text>

    <!-- Filter Tabs (Today | Upcoming | No Date | Done) -->
    <g transform="translate(28, 114)">
      <rect x="0" y="0" width="68" height="30" rx="15" fill="#14B8A6"/>
      <text x="34" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#042F2E">Today (2)</text>

      <rect x="76" y="0" width="88" height="30" rx="15" fill="#1E293B"/>
      <text x="120" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">Upcoming (2)</text>

      <rect x="172" y="0" width="74" height="30" rx="15" fill="#1E293B"/>
      <text x="209" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">No Date</text>

      <rect x="254" y="0" width="50" height="30" rx="15" fill="#1E293B"/>
      <text x="279" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">Done</text>
    </g>

    <!-- Task Card 1 (Pinned) -->
    <g transform="translate(28, 158)">
      <rect x="0" y="0" width="304" height="84" rx="16" fill="#1E293B" stroke="#14B8A6" stroke-width="1.2"/>
      <circle cx="24" cy="30" r="10" fill="none" stroke="#2DD4BF" stroke-width="2.2"/>
      <text x="44" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Call mom about family dinner</text>
      <text x="280" y="28" font-family="system-ui, sans-serif" font-size="13" fill="#F59E0B">📌</text>
      <text x="44" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">📞 +1 (555) 234-5678 • From Chat Screenshot</text>
      <rect x="44" y="56" width="112" height="20" rx="6" fill="#134E4A"/>
      <text x="100" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#5EEAD4">⏰ Today, 18:00</text>
      <rect x="164" y="56" width="96" height="20" rx="6" fill="#312E81"/>
      <text x="212" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#C7D2FE">🖼️ Screenshot #14</text>
    </g>

    <!-- Task Card 2 -->
    <g transform="translate(28, 254)">
      <rect x="0" y="0" width="304" height="80" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
