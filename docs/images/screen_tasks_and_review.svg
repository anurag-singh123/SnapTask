  <!-- ==================== RIGHT PHONE: REVIEW SCREENSHOT ==================== -->
  <g transform="translate(520, 62)" filter="url(#phoneShadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="360" height="528" rx="32" fill="#0B1120" stroke="#334155" stroke-width="3"/>
    <!-- Screen Content -->
