      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">PROMPT</text>
      <text x="12" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#F8FAFC">"Minimalist weekly sprint checklist poster with</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#F8FAFC">clean typography and neon teal icons"</text>
    </g>

    <!-- Generated Image Preview Canvas -->
    <g transform="translate(24, 234)">
      <rect x="0" y="0" width="312" height="162" rx="16" fill="url(#artPreview)"/>
      <rect x="20" y="18" width="272" height="126" rx="12" fill="#0F172A" opacity="0.82"/>
      <text x="156" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#5EEAD4">WEEKLY SPRINT BOARD</text>
      <text x="48" y="72" font-family="monospace" font-size="11" fill="#F8FAFC">[✓] Finalize UI Mockups</text>
      <text x="48" y="94" font-family="monospace" font-size="11" fill="#F8FAFC">[ ] Ship v2.1 Release Friday</text>
      <text x="48" y="116" font-family="monospace" font-size="11" fill="#F8FAFC">[ ] Review QA Metrics</text>
      <rect x="212" y="114" width="68" height="20" rx="6" fill="#14B8A6"/>
      <text x="246" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#042F2E">GENERATED</text>
    </g>

    <!-- Action Buttons Below Generated Image -->
    <g transform="translate(24, 408)">
      <rect x="0" y="0" width="148" height="38" rx="10" fill="#312E81" stroke="#6366F1" stroke-width="1"/>
      <text x="74" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E0E7FF">🪄 Use as Edit Input</text>

      <rect x="160" y="0" width="152" height="38" rx="10" fill="#14B8A6"/>
      <text x="236" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#042F2E">🔍 Scan into Tasks</text>
    </g>

    <!-- Bottom Nav -->
    <rect x="12" y="458" width="336" height="58" rx="20" fill="#1E293B"/>
    <g transform="translate(28, 468)">
      <text x="34" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">✓</text>
      <text x="34" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Tasks</text>

      <text x="114" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">📥</text>
      <text x="114" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Inbox</text>

      <rect x="166" y="2" width="56" height="24" rx="12" fill="#134E4A"/>
      <text x="194" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#5EEAD4">✨ AI</text>
      <text x="194" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#5EEAD4">AI Studio</text>

      <text x="274" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">⚙️</text>
      <text x="274" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Settings</text>
    </g>
  </g>
</svg>
