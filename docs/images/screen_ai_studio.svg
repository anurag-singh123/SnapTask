    <rect x="180" y="28" width="152" height="28" rx="8" fill="#14B8A6"/>
    <text x="256" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#042F2E">🎨 Image Studio</text>

