      <rect x="0" y="0" width="312" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#5EEAD4">Gemini Nano Banana 2.1</text>
      <text x="14" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Create new visual boards or edit photos with prompts</text>
    </g>

    <!-- Source Image Picker / Edit Mode -->
    <g transform="translate(24, 124)">
      <rect x="0" y="0" width="148" height="32" rx="8" fill="#1E293B" stroke="#14B8A6" stroke-width="1"/>
      <text x="74" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#5EEAD4">🖼️ Pick Photo to Edit</text>

      <rect x="160" y="0" width="152" height="32" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
      <text x="236" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#A5B4FC">✨ Text-to-Image Mode</text>
    </g>

    <!-- Prompt Box -->
    <g transform="translate(24, 166)">
