<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="440">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" rx="24" fill="url(#bgGrad)"/>

  <!-- Decorative glowing orbs -->
  <circle cx="180" cy="80" r="140" fill="#14B8A6" opacity="0.12"/>
  <circle cx="1020" cy="360" r="180" fill="#6366F1" opacity="0.15"/>
  <circle cx="650" cy="60" r="110" fill="#38BDF8" opacity="0.08"/>

  <!-- Left Section: App Identity & Badges -->
  <g transform="translate(56, 56)">
    <!-- App Icon -->
    <rect x="0" y="0" width="68" height="68" rx="18" fill="url(#tealGrad)" filter="url(#cardShadow)"/>
    <rect x="14" y="14" width="40" height="40" rx="8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 4"/>
    <path d="M24 35 L31 42 L45 26" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="86" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#F8FAFC">SnapTask</text>
    <text x="86" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#2DD4BF" letter-spacing="1.2">SCREENSHOTS TO ACTIONABLE TASKS &amp; AI STUDIO</text>

    <text x="0" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#CBD5E1">
      Turn forgotten screenshots into structured reminders with
    </text>
    <text x="0" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#CBD5E1">
      bundled on-device OCR, smart date parsing, and Gemini AI.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 174)">
      <rect x="0" y="0" width="168" height="34" rx="17" fill="#1E293B" stroke="#14B8A6" stroke-width="1.5"/>
      <text x="84" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#5EEAD4">On-Device ML Kit OCR</text>

      <rect x="180" y="0" width="166" height="34" rx="17" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
      <text x="263" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#A5B4FC">Gemini Multi-Turn Chat</text>

      <rect x="358" y="0" width="174" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="445" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#7DD3FC">Google Search Grounding</text>
    </g>

    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="176" height="34" rx="17" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="88" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FCD34D">Nano Banana 2.1 Studio</text>

      <rect x="188" y="0" width="172" height="34" rx="17" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="274" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6EE7B7">Sensitive OTP/Card Shield</text>

      <rect x="372" y="0" width="160" height="34" rx="17" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
      <text x="452" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F472B6">WorkManager + Alarms</text>
    </g>

    <!-- Bottom Tech Stack Strip -->
    <g transform="translate(0, 290)">
      <text x="0" y="20" font-family="monospace" font-size="13" fill="#94A3B8">
        Kotlin • Jetpack Compose • Material 3 • Room • DataStore • ML Kit • Firebase AI Logic
      </text>
    </g>
  </g>

  <!-- Right Section: Visual Pipeline Illustration -->
  <!-- Card 1: Screenshot Input -->
  <g transform="translate(640, 48)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="230" height="336" rx="22" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="16" y="16" width="198" height="26" rx="8" fill="#0F172A"/>
    <circle cx="30" cy="29" r="5" fill="#14B8A6"/>
    <text x="44" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">SCREENSHOT CAPTURED</text>

    <!-- Chat Bubble 1 -->
    <rect x="16" y="56" width="180" height="58" rx="12" fill="#0F172A" stroke="#14B8A6" stroke-width="1.2" stroke-dasharray="4 2"/>
    <text x="26" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">Alex • Chat Message</text>
    <text x="26" y="94" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0">"Can you send the Q4</text>
    <text x="26" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0">report by Friday 5pm?"</text>

    <!-- Checklist Bubble -->
    <rect x="16" y="126" width="198" height="92" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 2"/>
    <text x="26" y="146" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">OCR Detected Checklist</text>
    <text x="26" y="166" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0">• Call mom tomorrow 6pm</text>
    <text x="26" y="186" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0">• Pay electricity bill by 15th</text>
    <text x="26" y="206" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0">• Book dentist appointment</text>

    <!-- Sensitive Shield Badge -->
    <rect x="16" y="232" width="198" height="44" rx="10" fill="#064E3B"/>
    <text x="28" y="251" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399">🛡️ Sensitive Filter Active</text>
    <text x="28" y="267" font-family="system-ui, sans-serif" font-size="10" fill="#A7F3D0">OTPs, CVVs &amp; Cards Auto-Skipped</text>

    <!-- Notification Banner -->
    <rect x="16" y="288" width="198" height="34" rx="8" fill="url(#tealGrad)"/>
    <text x="115" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">🔔 4 Tasks Found • Review</text>
  </g>

  <!-- Arrow Connector -->
  <g transform="translate(878, 198)">
    <circle cx="20" cy="20" r="18" fill="url(#indigoGrad)"/>
    <path d="M13 20 H27 M22 14 L28 20 L22 26" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Card 2: Tasks + Gemini AI Studio Output -->
  <g transform="translate(924, 48)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="236" height="336" rx="22" fill="#1E293B" stroke="#4F46E5" stroke-width="2"/>
    <rect x="16" y="16" width="204" height="26" rx="8" fill="#0F172A"/>
    <circle cx="30" cy="29" r="5" fill="#818CF8"/>
    <text x="44" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#C7D2FE">TASKS &amp; GEMINI AI STUDIO</text>

    <!-- Task Item 1 -->
    <rect x="16" y="54" width="204" height="52" rx="10" fill="#0F172A"/>
    <circle cx="34" cy="80" r="8" fill="none" stroke="#2DD4BF" stroke-width="2"/>
    <text x="50" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Send Q4 report</text>
    <rect x="50" y="83" width="84" height="16" rx="4" fill="#134E4A"/>
    <text x="92" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#5EEAD4">⏰ Fri • 17:00</text>

    <!-- Task Item 2 -->
    <rect x="16" y="114" width="204" height="52" rx="10" fill="#0F172A"/>
    <circle cx="34" cy="140" r="8" fill="none" stroke="#2DD4BF" stroke-width="2"/>
    <text x="50" y="135" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Call mom</text>
    <rect x="50" y="143" width="106" height="16" rx="4" fill="#1E3A8A"/>
    <text x="103" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#93C5FD">⏰ Tomorrow • 18:00</text>

    <!-- Gemini Grounded Research Card -->
    <rect x="16" y="176" width="204" height="92" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2"/>
    <text x="28" y="196" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#A5B4FC">✨ Gemini 3.8 + Google Search</text>
    <text x="28" y="214" font-family="system-ui, sans-serif" font-size="10" fill="#E0E7FF">Action plan &amp; live web citations</text>
    <text x="28" y="228" font-family="system-ui, sans-serif" font-size="10" fill="#E0E7FF">attached to your task notes.</text>
    <rect x="28" y="238" width="96" height="20" rx="6" fill="#312E81"/>
    <text x="76" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#C7D2FE">🌐 3 Web Sources</text>

    <!-- Image Studio Card -->
    <rect x="16" y="278" width="204" height="44" rx="10" fill="url(#indigoGrad)"/>
    <text x="118" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">🎨 Nano Banana 2.1 Image Studio</text>
    <text x="118" y="313" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#E0E7FF">Generate, Edit &amp; Scan into Tasks</text>
  </g>
</svg>
